<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Map — Still Open</title>
<meta name="description" content="Every road covered by Still Open on one map of the United States: bridges, passes, tunnels and interstates that are still open, still used, and still dangerous.">
<link rel="canonical" href="https://stillopenroads.com/map.html">
<meta property="og:title" content="Still Open — the road map">
<meta property="og:description" content="Every road we have covered, on one map.">
<meta property="og:image" content="https://i.ytimg.com/vi/p5c6GqLvipg/maxresdefault.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f6b3f'/%3E%3Cpath d='M6 26 C12 18 14 14 26 6' stroke='%23f2c230' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  .map-head{padding:28px 0 18px}
  .map-head h1{font:800 clamp(28px,4vw,40px)/1.1 "Overpass",system-ui,sans-serif;margin:0 0 6px}
  .map-head p{margin:0;color:var(--ink-soft)}
  #map{height:min(72vh,720px);min-height:420px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:48px;background:var(--paper-2)}
  .pin{width:18px;height:18px;border-radius:50%;background:var(--danger);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .pin.file{background:var(--sign)}
  .pop{width:240px;font-family:"Source Serif 4",Georgia,serif}
  .pop img{width:100%;border-radius:6px;margin-bottom:8px}
  .pop .pl{font-style:italic;color:#5a5b4e;font-size:13px}
  .pop h3{font:700 15px/1.3 "Overpass",system-ui,sans-serif;margin:2px 0 8px;color:#24261f}
  .pop .links{display:flex;gap:12px;font:700 14px/1 "Overpass",system-ui,sans-serif}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font:600 14px/1 "Overpass",system-ui,sans-serif;margin:10px 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./">
      <svg class="shield" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#fff"/><path d="M6 26 C12 18 14 14 26 6" stroke="#d9481c" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      STILL OPEN
    </a>
    <nav>
      <a href="./#roads">Road Files</a>
      <a href="map.html" aria-current="page">Map</a>
      <a href="https://www.youtube.com/@StillOpenRoads?sub_confirmation=1">YouTube</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="map-head">
    <h1>Every road on one map</h1>
    <p id="mcount">Tap a pin to see the video.</p>
  </div>
  <div class="legend"><span><i style="background:var(--sign)"></i>Video + Road File</span><span><i style="background:var(--danger)"></i>Video</span></div>
  <div id="map" role="region" aria-label="Map of all roads"></div>
</div>

<footer>
  <div class="wrap">
    <div><strong>Still Open</strong> · <a href="https://www.youtube.com/@StillOpenRoads">youtube.com/@StillOpenRoads</a></div>
    <div class="fine">Pins mark the approximate location of each road. For information only; always check your state's 511 service before you drive.</div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="videos.js"></script>
<script>
(function(){
  var V = (window.VIDEOS || []).filter(function(v){ return typeof v.lat === "number"; });
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  document.getElementById("mcount").textContent = V.length + " roads so far. Tap a pin to see the video.";
  if (!window.L) { document.getElementById("map").innerHTML = '<p style="padding:20px">The map could not load. <a href="./#roads">Browse the Road Files instead.</a></p>'; return; }
  var map = L.map("map", { scrollWheelZoom: false, worldCopyJump: true }).setView([39.5, -98.5], 4);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 12, subdomains: "abcd",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  var pts = [];
  V.forEach(function(v){
    var icon = L.divIcon({ className: "", html: '<div class="pin' + (v.page ? ' file' : '') + '"></div>', iconSize: [18,18], iconAnchor: [9,9] });
    var yt = "https://www.youtube.com/watch?v=" + v.id;
    var html = '<div class="pop"><img src="https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg" alt="" loading="lazy">' +
      '<div class="pl">' + esc(v.place) + ' · ' + esc(v.state) + '</div><h3>' + esc(v.title) + '</h3>' +
      '<div class="links"><a href="' + yt + '" target="_blank" rel="noopener">Watch</a>' + (v.page ? '<a href="' + v.page + '">Road File</a>' : '') + '</div></div>';
    L.marker([v.lat, v.lng], { icon: icon, title: v.place }).bindPopup(html, { maxWidth: 260 }).addTo(map);
    if (v.lng > -130 && v.lat < 50) pts.push([v.lat, v.lng]);
  });
  if (pts.length) map.fitBounds(pts, { padding: [30, 30] });
})();
</script>
</body>
</html>
